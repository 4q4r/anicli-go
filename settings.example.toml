# ==========================================
# ANICLI-GO КОНФИГУРАЦИЯ (ПРИМЕР)
# ==========================================
# Скопируйте этот файл в одно из мест:
#   - путь, переданный флагом --config;
#   - $ANICLI_CONFIG;
#   - $XDG_CONFIG_HOME/anicli/settings.toml
#     (обычно ~/.config/anicli/settings.toml).
# Отсутствующий файл = значения по умолчанию, ошибки нет.
#
# Секреты можно задавать переменными окружения (перекрывают файл):
#   ANICLI_PROXY_URL           — прокси-URL;
#   ANICLI_SHIKIMORI_SESSION   — cookie _kawai_session;
#   ANICLI_DB_URL              — путь к базе SQLite;
#   ANICLI_KODIK_TOKEN         — токен API Kodik;
#   ANICLI_API_AUTH_SECRET     — ключ подписи API-токенов.

# ------------------------------------------
# [general] Общие пути
# ------------------------------------------
[general]
# Каталог данных (база, загрузки, кэш).
# Пусто = автоматически: $ANICLI_DATA > $XDG_DATA_HOME/anicli > ~/.local/share/anicli
# data_dir = "/var/lib/anicli"

# ------------------------------------------
# [network] Сеть
# ------------------------------------------
[network]
# Таймаут подключения (сек). Значение перенесено из anicli-py.
# Ещё и бюджет «тихого» соединения: попытка, не приславшая заголовки
# ответа за это время, обрывается и повторяется на новом соединении.
# Если у маршрута первый байт легитимно приходит позже — поднимите
# значение (иначе детерминированно медленный эндпоинт упрётся в
# 3 попытки × таймаут). Значения >= request_timeout приравниваются к нему.
connect_timeout = "10s"

# Таймаут запроса/чтения (сек). Значение перенесено из anicli-py.
request_timeout = "30s"

# Потолок на участие ОДНОГО провайдера в поисковом веере и в doctor:
# все его запросы (варианты названия / две тестовые фразы) должны
# уложиться в этот бюджет, иначе строка помечается таймаутом (PR24).
search_timeout = "30s"

# Максимум параллельных запросов к источникам.
max_parallel = 4

# User-Agent для запросов (важен для обхода защит).
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

# Глобальный прокси (http/https/socks5). Пусто или отсутствие ключа = прямое соединение.
# proxy_url = "socks5://user:pass@127.0.0.1:9050"

# ------------------------------------------
# [player] Видеоплеер
# ------------------------------------------
[player]
# Путь к бинарному файлу mpv.
# Linux: "mpv" (если в PATH); Windows: "C:\\Program Files\\mpv\\mpv.exe"
path = "mpv"

# Желаемое качество видео ("1080", "720", ...).
# Будет выбрано наиболее близкое доступное.
quality = "1080"

# ------------------------------------------
# [shikimori] Интеграция с трекером
# ------------------------------------------
[shikimori]
# Включить модуль.
enabled = false

# Cookie "_kawai_session" (обязательна для записи прогресса).
# Взять в браузере: DevTools (F12) -> Application -> Cookies -> shikimori.io
# session = "ВАШ_ТОКЕН_ЗДЕСЬ"

# OAuth2 access token (альтернатива session; используется при наличии).
# Создайте приложение на https://shikimori.io/apps и выполните:
#   anicli shikimori auth --client-id XXX --client-secret YYY
# Поля ниже заполняются автоматически командой auth; access-токен живёт
# сутки и продлевается автоматически (refresh за 5 минут до истечения
# или после 401), новые токены сохраняются в этот же файл.
# access_token = "..."
# refresh_token = "..."
# token_expires_at = 0
# client_id = "..."
# client_secret = "..."

# ------------------------------------------
# [skip] Пропуск заставок
# Порядок провайдеров и точечные выключатели.
# ------------------------------------------
[skip]
# Порядок fallback-цепочки провайдеров пропусков.
providers_order = ["aniskip", "anime_skip", "intro_skipper"]

# Использовать Anime Skip API.
anime_skip_enabled = true

# Использовать локальные эвристики ffprobe/ffmpeg (Intro Skipper).
intro_skipper_enabled = true

# ------------------------------------------
# [download] Загрузка серий
# ------------------------------------------
[download]
# Корневой каталог загрузок. Пусто = <каталог данных>/downloads.
# dir = "/mnt/nas/anime"

# Максимум одновременных загрузок.
max_concurrency = 2

# ------------------------------------------
# [api] Локальный HTTP-API (для webui)
# ------------------------------------------
[api]
# Включить API-сервер. По умолчанию выключен.
enabled = false

# Адрес привязки. По умолчанию только локальный интерфейс.
bind = "127.0.0.1:8765"

# Время жизни access-токена.
token_ttl = "15m"

# Время жизни refresh-токена (сессии входа; ротация при каждом refresh).
refresh_token_ttl = "720h"

# Ключ подписи access-токенов (HMAC-SHA256). Обязателен при enabled = true.
# Переменная окружения ANICLI_API_AUTH_SECRET перекрывает это значение.
# auth_secret_key = "СЛУЧАЙНАЯ_ДЛИННАЯ_СТРОКА"

# ------------------------------------------
# [web.users] Пользователи API (token auth)
# ------------------------------------------
# Каждый пользователь — секция [web.users.<имя>] с pbkdf2-хэшем пароля.
# Формат: pbkdf2_sha256$<итерации>$<соль_b64url>$<дайджест_b64url>
# (совместим с anicli-py; Basic Auth удалён).
# [web.users.alice]
# password_hash = "pbkdf2_sha256$240000$..."

# ------------------------------------------
# [providers] Настройки отдельных источников
# ------------------------------------------
[providers]
# Исключить провайдеров из поиска по ID (например ["animepahe", "kodik"])
# exclude = []
# Исключить потоки по регулярным выражениям имён озвучек/качеств
# (например ["трейлер", "реклама"] — отбросит мусорные потоки)
# exclude_streams = []

[providers.kodik]
# Токен API Kodik (https://kodik-api.com отвечает 401 без токена).
# Обязателен только если выбран источник kodik: без него команда,
# использующая kodik, завершится явной ошибкой конфигурации.
# Переменная окружения ANICLI_KODIK_TOKEN перекрывает это значение.
# token = "ВАШ_ТОКЕН_ЗДЕСЬ"

[providers.hdrezka]
# Маршрут провайдера hdrezka: корень зеркала семейства rezka (PR72).
# Семейство гео-фенсит по домену: hdrezka-home.tv (и его канонические
# близнецы hdrezka.ag / rezka.ag) с датацентровых выходов отдаёт
# страницы/поиск, но УДЕРЖИВАЕТ ссылки на видео (JWT сессии честно
# пишет geo:"..."), а rezka-ua.tv с того же выхода отдаёт полностью —
# он и стоит по умолчанию. Когда семейство снова поменяет маршрут,
# впишите рабочий корень здесь (со схемой, без слэша на конце):
# base_url = "https://rezka-ua.tv"

# ------------------------------------------
# [torrent] BitTorrent-подсистема (стриминг без внешних программ)
# ------------------------------------------
[torrent]
# Включить подсистему торрентов: стриминг магнитов и .torrent через
# локальный HTTP-сервер (mpv получает http://127.0.0.1/...), чистый
# Go, без внешних программ.
# ВКЛЮЧЕНО ПО УМОЛЧАНИЮ и это безопасно: движок стартует лениво, сам
# по себе не запускается ничего (ни DHT, ни трекеров) — сеть включается
# только когда торрент-провайдер поиска отдаёт релиз. no_upload = false
# означает этичную раздачу после просмотра; поставьте no_upload =
# true, чтобы работать только на скачивание.
# Через эту же подсистему работают торрент-провайдеры поиска nyaa,
# anilibria-torrent, animetosho и tokyotosho: выключенный [torrent]
# автоматически отключает и их.
enabled = true

# Каталог данных торрентов (создаётся по требованию). Пусто —
# ~/.local/share/anicli/torrents.
# dir = ""

# Порт BitTorrent-обменника. 0 — случайный свободный порт.
port = 42069

# Запретить раздачу (только скачивание).
no_upload = false

# Окно опережающего чтения при стриминге, МБ.
readahead_mb = 32

# Прокси для HTTP-трафика движка: http/https/socks5. Проксируются
# announce http/https-трекеров, web-seed и внутренние загрузки
# библиотеки; ТРАФИК ПИРОВ (TCP/uTP) и udp-трекеры остаются прямыми —
# ограничение библиотеки. ВАЖНО: скачивание .torrent-файлов
# провайдерами поиска идёт через общий сетевой клиент
# (network.proxy_url), а не через этот прокси. Пусто — всё напрямую.
# proxy = "socks5://127.0.0.1:9050"

# Пользовательские трекеры (udp/http/https/ws/wss announce-URL): они
# добавляются к каждому торренту для ускорения поиска пиров. Движок
# проверяет их здоровье параллельно (ограниченный пул, таймаут на
# каждый) и отфасовывает нерабочие — с записью причины в лог.
# Перепроверка — при следующем старте движка (после простоя).
# trackers = [
#     "udp://tracker.opentrackr.org:1337/announce",
#     "http://tracker.example.org/announce",
# ]

# Внешние списки трекеров (PR41): URL на plain-text файл, один
# announce-URL в строке, '#' — комментарии. Списки скачиваются ОДИН
# раз при старте движка (лениво — вместе с первым торрентом) через
# общий сетевой клиент (network.proxy_url, не [torrent] proxy),
# парсятся построчно (пустые строки, комментарии и мусорные строки
# пропускаются с записью причины в лог), дедуплицируются со
# статическими trackers (scheme+host без учёта регистра) и попадают
# в тот же пул с проверкой здоровья: неживые отсеиваются. Ошибка
# загрузки списка не ломает подсистему — статические trackers
# продолжают работать; исход виден в статусах движка и логе.
# tracker_lists = [
#     "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all.txt",
#     # вариант поменьше, только лучшие:
#     # https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt
# ]

# ------------------------------------------
# [cf] Встроенный обход Cloudflare (CloakBrowser) — ВСЕГДА ВКЛЮЧЁН (PR80)
# ------------------------------------------
[cf]
# Параметр enabled УДАЛЁН (PR80): обход — неотключаемая часть
# приложения. Стелс-браузер скачивается автоматически при первом
# запуске, если его нет (с цветным прогрессом в терминале); ручной
# `anicli cf install` больше не требуется.
#
# animepahe и allanime ходят через стелс-браузерный мост: их сайты
# пере-челленджат небраузерные отпечатки даже с повторенными
# clearance-куками (досье PR71).

# Сколько времени простой browser-сессии живёт после последнего
# решения (по умолчанию 15s). Браузер запускается только на время
# решения challenge и закрывается после простоя, чтобы не держать
# ~300-600 МБ памяти резидентно. "0s" — закрывать сразу после
# последнего решения.
browser_idle_timeout = "15s"

# Бюджет одного решения challenge.
solve_timeout = "90s"

# Автообновление стелс-Chromium (проверка сети, никогда не блокирует
# решение; переменная окружения CLOAKBROWSER_AUTO_UPDATE=false
# принудительно отключает).
auto_update = true

# Период повтора отложенного из-за оффлайна обновления.
update_interval = "30m"

# Прокси для СКАЧИВАНИЙ/ОБНОВЛЕНИЙ CloakBrowser (PR80): загрузка
# stealth-Chromium, free/pro-каналы, проверка лицензии и проверки
# обновлений. Пусто (по умолчанию) — прямое соединение. Схемы: http,
# https, socks5, socks5h.
# ГРАНИЦЫ (не путать): этот прокси НЕ касается трафика страниц
# стелс-браузера и НЕ касается трафика источников — провайдеры и
# страницы браузера ходят через network.proxy_url.
# proxy = "socks5://127.0.0.1:1080"

# Канал стелс-Chromium (PR73):
#   auto (по умолчанию) — база free: публичные free-релизы GitHub, без
#       ключа ни одного pro-запроса; при действующем ключе
#       (`anicli cf login`) установки и обновления автоматически
#       тянут канал pro — но только совместимую с драйвером chromedp
#       версию; несовместимый/недоступный pro пишется громким
#       предупреждением, приложение продолжает работать на free;
#   free  — pro не трогается никогда, даже с ключом;
#   pro   — всегда лицензионный канал (нужен действующий ключ;
#       прежнее поведение, отказ pro громкий, тихого отката нет).
# Любое другое значение — ошибка конфигурации при старте.
channel = "auto"

# Канал Pro (лицензия) — в config проброс не нужен, отдельные ключи
# отсутствуют: `anicli cf login <ключ>` проверяет ключ через API
# cloakbrowser.dev и сохраняет его в ~/.cloakbrowser/license.key
# (бесплатный ключ: https://cloakbrowser.dev/free). Переменная
# окружения CLOAKBROWSER_LICENSE_KEY имеет приоритет над файлом.
# При действующей лицензии и channel = auto|pro автообновление
# качает канал Pro (проверка Ed25519-подписи
# манифеста обязательна для обоих каналов); в явном канале pro откат
# на free не выполняется молча. Кэш переиспользуется каналом Pro
# только когда разрешённая pro-версия совпадает с установленной
# pro-папкой (маркер .channel внутри chromium-<version>); free-папка
# кэша канал Pro не удовлетворяет. Выход: `anicli cf logout`.
