# goreleaser v2 config — cross-platform release engineering.
# Six-target matrix: linux/{amd64,arm64}, windows/{amd64,arm64},
# darwin/{amd64,arm64}; CGO disabled (pure-Go sqlite); version triple
# injected at internal/cli's -ldflags seams. GitHub release (default).
version: 2

project_name: anicli-go

builds:
  - id: anicli
    main: ./cmd/anicli
    binary: anicli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Single -ldflags string wired to the existing seam in internal/cli/root.go.
    ldflags:
      - -s -w -X github.com/an0nx/anicli-go/internal/cli.Version={{.Version}} -X github.com/an0nx/anicli-go/internal/cli.Commit={{.FullCommit}} -X github.com/an0nx/anicli-go/internal/cli.Date={{.Date}}

archives:
  - id: anicli
    ids:
      - anicli
    # Raw binaries as release assets, no tar.gz/zip wrapping (#154).
    # `files:` is ignored in binary mode; docs: customization/package/archives.
    formats: [binary]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge"

# Publish channels (#156) — live: the homebrew tap (4q4r/homebrew-tap) and
# the winget fork (4q4r/winget-pkgs, PRd against microsoft/winget-pkgs) are
# set up and publish on every tagged release. aurs alone stays inert with
# skip_upload: true (AUR registration suspended upstream); flip it to
# activate. Outputs are also built into dist/ per release and inspectable.
# Docs: customization/publish/{aur,homebrew_casks,winget}, package/nfpm.

nfpms:
  - id: packages
    package_name: anicli-go
    # Mirrors the raw-binary naming: anicli-go_<ver>_<os>_<arch>.<deb|rpm>.
    file_name_template: "{{.PackageName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats: [deb, rpm]
    bindir: /usr/bin
    maintainer: 4q4r
    homepage: https://github.com/4q4r/anicli-go
    description: Anime browser & downloader TUI (anilibria)
    license: MIT

aurs:
  - name: anicli-go-bin
    homepage: https://github.com/4q4r/anicli-go
    description: Anime browser & downloader TUI (anilibria)
    license: MIT
    maintainers:
      - 4q4r
    # Passphraseless AUR SSH key; only needed once skip_upload flips to false.
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/anicli-go-bin.git
    # makepkg saves aliased sources under the alias name (ArchWiki: PKGBUILD
    # `source=('<name>::<uri>')`), so the default package() — which references
    # the URL basename — would not find the binary. Install the aliased
    # per-arch source instead; $CARCH is x86_64/aarch64.
    package: 'install -Dm755 "./${pkgname}_${pkgver}_${CARCH}.binary" "${pkgdir}/usr/bin/anicli"'
    skip_upload: true

homebrew_casks:
  - name: anicli-go
    repository:
      owner: 4q4r
      name: homebrew-tap
    homepage: https://github.com/4q4r/anicli-go
    description: Anime browser & downloader TUI (anilibria)
    binaries: [anicli]

winget:
  - name: anicli-go
    publisher: 4q4r
    homepage: https://github.com/4q4r/anicli-go
    short_description: Anime browser & downloader TUI (anilibria)
    license: MIT
    repository:
      owner: 4q4r
      name: winget-pkgs
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
